{% extends "base.html" %}
{% block title %}Удаление отзыва — QuestHub{% endblock %}
{% block content %}
<section class="form-card">
  <h1>Удалить отзыв?</h1>
  <p>Вы действительно хотите удалить ваш отзыв о квесте «{{ review.quest.title }}»?</p>
  <form method="post">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">Удалить</button>
    <a class="btn btn-secondary" href="{% url 'booking:quest_detail' slug=review.quest.slug %}">Отмена</a>
  </form>
</section>
{% endblock %}
