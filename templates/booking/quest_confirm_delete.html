{% extends "base.html" %}
{% block title %}Удаление квеста — QuestHub{% endblock %}
{% block content %}
<section class="form-card">
  <h1>Удалить квест «{{ quest.title }}»?</h1>
  <p>Действие необратимо, если по квесту ещё нет бронирований.</p>
  <form method="post">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">Удалить</button>
    <a class="btn btn-secondary" href="{% url 'booking:quest_detail' slug=quest.slug %}">Отмена</a>
  </form>
</section>
{% endblock %}
