{% extends "base.html" %}
{% block title %}Удаление команды — QuestHub{% endblock %}
{% block content %}
<section class="form-card">
  <h1>Удалить команду «{{ team.name }}»?</h1>
  <p>Если у команды есть активные или прошлые бронирования, удаление будет заблокировано.</p>
  <form method="post">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">Удалить</button>
    <a class="btn btn-secondary" href="{% url 'booking:team_list' %}">Отмена</a>
  </form>
</section>
{% endblock %}
